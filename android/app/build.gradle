plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace = "com.pakperegrine.hayya_al_salah"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.pakperegrine.hayya_al_salah"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        
        // Add 16 KB page size support
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        
        // Enable 16 KB page size testing
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        testInstrumentationRunnerArguments = [
            'androidx.test.orchestrator.CLEAR_PACKAGE_DATA': 'true'
        ]
        
        // Add manifest placeholders for 16 KB support
        manifestPlaceholders = [
            'PAGE_SIZE_16KB_SUPPORTED': 'true'
        ]
    }

    signingConfigs {
        release {
            storeFile file(localProperties['keystore.file'])
            storePassword localProperties['keystore.password']
            keyAlias localProperties['key.alias']
            keyPassword localProperties['key.password']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Enable 16 KB page size support in release builds
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            // Enable 16 KB page size support in debug builds
            testCoverageEnabled false
        }
    }

    // Configure packaging options for 16 KB support
    packagingOptions {
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }

    // Add bundle configuration for 16 KB page support
    bundle {
        density {
            enableSplit true
        }
        abi {
            enableSplit true
        }
        language {
            enableSplit false
        }
    }

    dependencies {
        implementation 'com.android.support:multidex:1.0.3'
        
        // Add dependencies for 16 KB page size testing
        androidTestImplementation 'androidx.test.ext:junit:1.1.5'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
        androidTestImplementation 'androidx.test:runner:1.5.2'
        androidTestImplementation 'androidx.test:rules:1.5.0'
    }
}

flutter {
    source = "../.."
}
